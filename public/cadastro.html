  <main class="min-vh-100">
    <div class="row align-items-stretch g-0 flex-grow-1">
      <div class="d-flex d-none d-md-flex col-12 col-md-6 g-0">
        <img src="./assets/imgs/radar3.png" class="object-fit-cover w-100 h-100 rounded-end-5">
      </div>
      <div class="col-12 col-md-6 g-0 d-flex flex-column position-relative min-vh-100">
        <div class="position-absolute align-self-end mt-3 me-3">
          <a href="./index.html">
            <button class="btn btn-outline-light py-1 px-1 fs-6">Voltar</button>

        </div>

          <h1 class="ms-2 text-white mt-3 px-3 fs-2">Bem-Vindo à Strong Eye</h1>
          <div class="container d-flex justify-content-center formulario">
            <form class="d-flex flex-column w-100 mx-2">
              <div class="form-floating mb-3 mt-5">
                <input type="text" class="form-control" id="nome_input"  placeholder="Password"/>
                <label for="floatingPassword">Nome</label>
              </div>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email_input" placeholder="email@example.com" />
                <label for="floatingInput">Email empresarial</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="senha_input"  placeholder="Min. 8 caracteres"/>
                <label for="floatingPassword">Senha (min. 8 caracteres)</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirmacao_senha_input"  placeholder="Password"/>
                <label for="floatingPassword">Confirmar senha</label>
              </div>
              <button onclick="cadastrar()" class="btn btn-info w-100 py-2" type="submit">
                Cadastre-se
              </button>
              <div>
                <a class="mt-1 mb-3" href="./login.html">Já possui uma conta?</a>
              </div>
            </form>

          </div>
        </div>
      </div>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    // var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
      // codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    // for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
    //   if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
    //     idEmpresaVincular = listaEmpresasCadastradas[i].id
    //     console.log("Código de ativação válido.");
    //     break;
    //   } else {
    //     cardErro.style.display = "block";
    //     mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
    //     finalizarAguardar();
    //   }
    // }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
