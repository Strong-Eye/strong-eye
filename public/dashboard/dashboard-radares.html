<head>

    <style>
        @font-face {
            font-family: 'Manrope';
            src: url('../assets/font/Manrope/Manrope-VariableFont_wght.ttf') format('truetype');
            font-weight: 200 800;
            font-style: normal;
        }

        body {
            font-family: "Manrope", Arial, Helvetica, sans-serif;
            background-color: #0C0E11;
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card {
            display: flex;
            flex: 0 0 calc((100% - 24px) / 3);
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            box-sizing: border-box;
            background-color: #13161C;
            padding: 16px;
            border-radius: 10px;
        }

        .row {
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .row-space-beteween {
            justify-content: space-between;
        }

        .radar-box-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .radar-chart {
            position: relative;
            height: 6px;
            width: 100%;
            background: #4a5568;
            border-radius: 999px;
            overflow: hidden;
        }

        .radar-chart canvas {
            display: block;
        }

        .radar-card-subtitulo {
            color: #8a97ad;
            font-size: 15px;
            font-weight: 400;
        }

        .radar-card-subtitulo-bold {
            color: #ffffff;
            font-weight: 800;
        }

        .radar-card-subtitulo-light {
            font-size: 13px;
            font-weight: 300;
        }

        .radar-card-titulo {
            color: #1578FA;
            font-size: 20px;
            font-weight: 800;
        }

        .radar-status-online {
            color: #40C84F;
            background-color: #2F503131;
            font-size: 12px;
            align-self: center;
            padding: 3px 8px;
            border-radius: 5px;
        }

        .radar-status-offline {
            color: #C84042;
            background-color: #502F2F31;
            font-size: 12px;
            align-self: center;
            padding: 3px 8px;
            border-radius: 5px;
        }

        .radares-button {
            background-color: #13161C;
            color: #8a97ad;
            ;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .radares-search {
            background-color: #13161C;
            color: #8a97ad;
            ;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .radares-search input {
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
            caret-color: #ffffff;
        }

        .radares-search input::placeholder {
            color: #8a97ad;
            ;
            font-size: 15px;
        }

        .radares-button-activate {
            background-color: #1578fa1a;
            color: #1578FA;
            ;
        }

        .divider {
            border: none;
            height: 1px;
            background-color: #8a97ad;
            ;
            margin: 12px 0;
        }

        .main {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            gap: 15px;
            padding: 24px;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 24px;
            padding: 20px 16px;
            background-color: #13161C;
        }

        .menu-sidebar {
            display: none;
        }

        @media (max-width: 1070px) {
            .card {
                flex: 0 0 calc((100% - 24px) / 2);
            }

            .menu-sidebar {
                display: block;
            }

            .sidebar {
                display: none;
            }

            .radar-card-subtitulo {
                font-size: 12px;
            }
        }

        .sidebar img {
            width: 100%;
        }

        .sidebar-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8a97ad;
            font-size: 15px;
            text-decoration: none;
        }

        .sidebar-label-activate {
            color: #ffffff;
            font-weight: 400;
        }

        .wrapper-top,
        .wrapper-bottom {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .wrapper {
            flex: 0;
        }

        .sidebar-user-row {
            background-color: #4e545e17;
            color: #8a97ad;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 40px;
            container-type: size;
            padding: 5px;
            border-radius: 5px;
        }

        .sidebar-user-icon {
            font-size: 70cqh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background-color: #13161cb0;
            display: none;
            z-index: 1000;
            padding: 25px;
        }

        .overlay.aberto {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-fechar {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #8a97ad;
            font-size: 16px;
            cursor: pointer;
        }
        
        .container-menu {
            flex: 1;
            max-width: 65vw;
            min-height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            background-color: #13161C;
            padding: 16px;
            border-radius: 10px;
            overflow-y: auto;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="dados.js"></script>

    <script>
        function criarBarra(canvasID, valor, max = 100) {
            return new Chart(document.getElementById(canvasID), {
                type: "bar",
                data: {
                    labels: [''],
                    datasets: [{
                        data: [valor],
                        backgroundColor: "#ffffff",
                        borderRadius: 999,
                        borderSkipped: false,
                        barPercentage: 1,
                        categoryPercentage: 1
                    }]
                },
                options: {
                    indexAxis: "y",
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 400 },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    layout: { padding: 0 },
                    scales: {
                        x: { display: false, min: 0, max: max },
                        y: { display: false }
                    }
                }
            });
        }

        function renderizarRadares(dados) {
            let container = document.getElementById("container-cards");
            container.replaceChildren(); 
            for (let i = 0; i < dados.length; i ++) {
                let cpuBoxInfo = "";
                if (dados[i]['cpu'] !== undefined && dados[i]['cpu'] !== null) {
                    cpuBoxInfo = `
                        <div class="radar-box-info" id="cpu">
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold">CPU:</span>
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold" id="radar-valor-cpu">${dados[i]['cpu']}%</span>
                            <div class="radar-chart"><canvas id="radar-chart-cpu-${dados[i]['id']}"></canvas></div>
                        </div>`
                }

                let ramBoxInfo = "";
                if (dados[i]['ram'] !== undefined && dados[i]['ram'] !== null) {
                    ramBoxInfo = `
                        <div class="radar-box-info" id="ram">
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold">RAM:</span>
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold" id="radar-valor-ram">${dados[i]['ram']}%</span>
                            <div class="radar-chart"><canvas id="radar-chart-ram-${dados[i]['id']}"></canvas></div>
                        </div>`
                }

                let discoBoxInfo = "";
                if (dados[i]['disco'] !== undefined && dados[i]['disco'] !== null) {
                    discoBoxInfo = `
                        <div class="radar-box-info" id="disco">
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold">DISCO:</span>
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold" id="radar-valor-disco">${dados[i]['disco']}%</span>
                            <div class="radar-chart"><canvas id="radar-chart-disco-${dados[i]['id']}"></canvas></div>
                        </div>`
                }

                let redeBoxInfo = "";
                if (dados[i]['rede'] !== undefined && dados[i]['rede'] !== null) {
                    redeBoxInfo = `
                        <div class="radar-box-info" id="rede">
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold">REDE:</span>
                            <span class="radar-card-subtitulo radar-card-subtitulo-bold" id="radar-valor-rede">${dados[i]['rede']}%</span>
                            <div class="radar-chart"><canvas id="radar-chart-rede-${dados[i]['id']}"></canvas></div>
                        </div>`
                }

                container.insertAdjacentHTML("beforeend", `
                    <div class="card" onclick="abrirModalRadar(${dados[i]['id']})">
                        <div class="row row-space-beteween">
                            <span class="radar-card-titulo" id="radar-nome">${dados[i]['nome']}</span>
                                <div class="radar-status-${dados[i]['status'].toLowerCase()}" id="radar-status">${dados[i]['status']}</div>
                        </div>
                    
                        <span class="radar-card-subtitulo" id="radar-endereco">${dados[i]['endereco']}</span>
                    
                        <div class="row" id="row-radar-componentes">
                            ${cpuBoxInfo}
                            ${ramBoxInfo}
                            ${discoBoxInfo}
                            ${redeBoxInfo}
                        </div>
                        <span class="radar-card-subtitulo radar-card-subtitulo-light" id="radar-ultima-leitura">Ultima leitura: ${dados[i]['ultima_leitura']}</span>
                    </div>
                `);

                if (dados[i]['cpu'] !== undefined && dados[i]['cpu'] !== null) {
                    criarBarra(`radar-chart-cpu-${dados[i]['id']}`, dados[i]['cpu']);
                }

                if (dados[i]['ram'] !== undefined && dados[i]['ram'] !== null) {
                    criarBarra(`radar-chart-ram-${dados[i]['id']}`, dados[i]['ram']);
                }

                if (dados[i]['disco'] !== undefined && dados[i]['disco'] !== null) {
                    criarBarra(`radar-chart-disco-${dados[i]['id']}`, dados[i]['disco']);
                }

                if (dados[i]['rede'] !== undefined && dados[i]['rede'] !== null) {
                    criarBarra(`radar-chart-rede-${dados[i]['id']}`, dados[i]['rede']);
                }
            }
        }

        function buscarRadar(termo, tipoBusca, dados) {
            let encontrados = [];
            for (let i = 0; i < dados.length; i++) {
                if (dados[i][tipoBusca].toLowerCase().includes(termo.toLowerCase())) {
                    encontrados.push(dados[i])
                }
            }
            return renderizarRadares(encontrados);
        }

        let timer;
        document.querySelector('#input-buscar-radar').oninput = (e) => {
            document.querySelector('.radares-button-activate')?.classList.remove('radares-button-activate');
            e.target.classList.add('radares-button-activate');
            timer = clearTimeout(timer) || setTimeout(() => {
                buscarRadar(e.target.value, "nome", dados_radares)
            }, 50);
        };

        document.querySelector('#button-radares-total').onclick = (e) => {
            document.querySelector('.radares-button-activate')?.classList.remove('radares-button-activate');
            e.target.classList.add('radares-button-activate');
            timer = clearTimeout(timer) || setTimeout(() => {
                renderizarRadares(dados_radares)
            }, 50);
        };

        document.querySelector('#button-radares-online').onclick = (e) => {
            document.querySelector('.radares-button-activate')?.classList.remove('radares-button-activate');
            e.target.classList.add('radares-button-activate');
            timer = clearTimeout(timer) || setTimeout(() => {
                buscarRadar('online', 'status', dados_radares)
            }, 50);
        };

        document.querySelector('#button-radares-offline').onclick = (e) => {
            document.querySelector('.radares-button-activate')?.classList.remove('radares-button-activate');
            e.target.classList.add('radares-button-activate');
            timer = clearTimeout(timer) || setTimeout(() => {
                buscarRadar('offline', 'status', dados_radares)
            }, 50);
        };

        function abrirModalRadar(id) {
            alert(`Você está acessando o radar: ${id}`)
        }

        function abrirMenu(id) {
            document.getElementById("modal-radar").classList.add("aberto");
        }
        
        function fecharMenu() {
            document.getElementById("modal-radar").classList.remove("aberto");
        }
    </script>
