<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/custom.css">

  <title>Strong Eye - Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="icon" href="../assets/icon/logo.png" />

  <style>
    .ponto-radar {
      width: 18px;
      height: 18px;
      top: 50%;
      cursor: pointer;
    }

    .ponto-radar:hover {
      border: 1px solid white;
    }
  </style>

</head>

<body class="d-flex flex-row min-vh-100">

  <div class="offcanvas-md offcanvas-start text-bg-dark vh-100 d-flex flex-column " style="width: 290px;" tabindex="-1"
    id="offcanvasResponsive" aria-labelledby="offcanvasResponsiveLabel">

    <div class="offcanvas-header bg-dark d-flex mb-0 pb-0">
      <img src="../assets/img/LOGO.png" alt="" style="max-height: 100%;" class="h-auto mw-100">
    </div>
    
    <div class="offcanvas-body p-3 d-flex flex-column justify-content-between flex-grow-1">
      <hr />
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="./cadastro-usuario.html" class="nav-link p-3 text-center" aria-current="true">
            <b>Cadastro de membros</b>
          </a>
        </li>
         <li class="nav-item">
          <a href="./cadastro-radar.html" class="nav-link p-4 text-center" aria-current="page">
            <b>Cadastro de radar</b>
          </a>
        </li>
        <li class="nav-item">
          <a href="./#" class="nav-link p-4 active text-center" aria-current="page">
            <b>Prevenção de componentes</b>
          </a>
        </li>
      </ul>
      <hr/>
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
          data-bs-toggle="dropdown" aria-expanded="false">
          <img src="../assets/icon/usuario.png" alt="" width="32" height="32" class="rounded-circle me-2" />
          <span id="span_email">Carregando...</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
          <li><a class="dropdown-item" href="../login.html">Sair da conta</a></li>
        </ul>
      </div>
    </div>
  </div>


  <main class="flex-grow-1 w-100 h-100 d-flex flex-column ms-3 me-3 overflow-auto">
    <div>
      <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasResponsive" aria-controls="offcanvasResponsive">
        Menu</button>
    </div>
    <div class="d-flex flex-column w-100 h-25 border-dark border-1 bg-dark mt-3 p-2">
      <div class="d-flex flex-row justify-content-between">
        <p class="text-white">Faixa de proridade de manutenção dos componentes:</p>
        <p class="text-white"><small>Exibindo próximos 14 dias.</small></p>
      </div>
      <div id="faixa" class="position-relative w-100 h-100"
          style="height:60px; background:linear-gradient(90deg,#ff232360 0 15.5%,#ffd43b60 15.5% 50%,#51cf6660 50% 100%)">
      </div>
      <div class="d-flex flex-row justify-content-between mt-1">
        <p class="small text-white">hoje</p>
        <p class="small text-white">7 dias</p>
        <p class="small text-white">14 dias</p>
      </div>
    </div>
  </main>

  <footer>

  </footer>
</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard-prevencao-componentes.js"></script>
<script src="js/script_conta.js"></script>
