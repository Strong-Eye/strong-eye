<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/custom.css">

  <title>Strong Eye - Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="icon" href="../assets/icon/logo.png" />
</head>

<body class="d-flex flex-row min-vh-100">

  <div class="offcanvas-md offcanvas-start text-bg-dark vh-100 d-flex flex-column " style="width: 290px;" tabindex="-1"
    id="offcanvasResponsive" aria-labelledby="offcanvasResponsiveLabel">

    <div class="offcanvas-header bg-dark d-flex mb-0 pb-0">
      <img src="../assets/img/LOGO.png" alt="" style="max-height: 100%;" class="h-auto mw-100">
    </div>
    
    <div class="offcanvas-body p-3 d-flex flex-column justify-content-between flex-grow-1">
      <hr />
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="./cadastro-usuario.html" class="nav-link p-3 active text-center" aria-current="true">
            <b>Cadastro de membros</b>
          </a>
        </li>
        <br><br>
         <li class="nav-item">
          <a href="./cadastro-radar.html" class="nav-link p-4 text-center" aria-current="page">
            <b>Cadastro de radar</b>
          </a>
        </li>
        <li class="nav-item">
          <a href="./dashboard-gerente.html" class="nav-link p-4 text-center" aria-current="page">
            <b>Dashboard gerente</b>
          </a>
        </li>
         <li class="nav-item">
          <a href="./dashboard-tecnico.html" class="nav-link p-4 text-center" aria-current="page">
            <b>Dashboard técnico</b>
          </a>
        </li>

      </ul>
      <hr />
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
          data-bs-toggle="dropdown" aria-expanded="false">
          <img src="../assets/icon/usuario.png" alt="" width="32" height="32" class="rounded-circle me-2" />
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
          <li><a class="dropdown-item" href="../login.html">Sair da conta</a></li>
        </ul>
      </div>
    </div>
  </div>


  <main class="flex-grow-1 w-100 h-100 d-flex flex-column ms-3 me-3 overflow-auto">
    <div>
      <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasResponsive" aria-controls="offcanvasResponsive">
        Menu</button>
    </div>

    <div class="mx-auto mt-5 pt-2 text-light">
      <h1 class=""><b>Cadastro de Códigos de Acesso</b></h1>
    </div>
    <div class="mx-auto pt-2 text-light">
      <h2 id="exibicao_codigo"></h2>
    </div>
    <div class="container mx-auto d-flex flex-column">
      <div class="d-flex align-self-center">
        <div class="d-flex flex-row gap-3">
          <!-- Botão de cadastro -->
          
          <div class="">
            <button class="btn btn-success h-100 rounded-0 rounded-start" onclick="cadastrarCodigo()">Gerar código</button>
            <div class="col-md pe-0 h-100">
              <div class="form-floating">
                <select class="form-select rounded-0 rounded-end" id="cargo_input">
                  <option value="1">Gestor</option>
                  <option value="2">Técnico</option>
                </select>
                <label for="floatingSelectGrid">Cargo</label>
              </div>
            </div>
          </div>
          <!-- Botão de exclusão -->

          <button class="btn btn-danger" onclick="popup2.showModal()">Excluir</button>
          <!-- PopUp Exclusão -->

          <dialog id="popup2">
            <form method="dialog">
              <div class="col-md pe-0">
                <div class="form-floating">
                  <select class="form-select" id="pessoa2_input">
                    <option selected>Escolha um membro</option>
                  </select>
                  <label for="pessoa2_input">Membro</label>
                </div>
              </div>
              <button type="button" class="modal-custom" onclick="remover()">Excluir</button>
              <button type="submit" id="fechar-popup2" onclick="popup2.close()">Fechar</button>
            </form>
          </dialog>

          <!-- Botão de Atualização -->

          <button class="btn btn-warning" onclick="popup1.showModal()">Atualizar</button>
          <!-- PopUp Atualização -->

          <dialog id="popup1">
            <form method="dialog">
              <div class="col-md pe-0">
                <div class="form-floating">
                  <select class="form-select" id="pessoa3_input3">
                    <option selected>Escolha um membro</option>
                  </select>
                  <label for="pessoa3_input">Membro</label>
                </div>
              </div>
              <div class="col-md pe-0">
                <div class="form-floating">
                  <select class="form-select" id="cargo2_input2">
                    <option value="1">Gestor</option>
                    <option value="2">Técnico</option>
                  </select>
                  <label for="cargo2_input">Cargo</label>
                </div>
              </div>
              <button type="button" class="modal-custom" onclick="atualizar()">Atualizar</button>
              <button type="submit" id="fechar-popup1" onclick="popup1.close()">Fechar</button>
            </form>
          </dialog>

        </div>
      </div>

      <div class="d-flex flex-row">
        <div class="gap-3 w-75">
          <div class="input-group gap-0 w-75">
            <span class="input-group-text">@</span>
            <input id="ipt_pesquisa" type="text" class="form-control" onblur="listarCodigos()" placeholder="Email Corporativo">
          </div>
          <div class="form-floating w-25">
            <select id="select_filtro" class="form-select text-center" onchange="listarCodigos()">
              <option value="1">Cargo</option>
              <option value="2">Nome (A-Z)</option>
              <option value="3">Nome (Z-A)</option>
            </select>
            <label for="select_filtro">Filtrar por</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center">
        <div class="border rounded-3 w-75 h-100 overflow-scroll" style="max-height: 400px;">
          <table id="tabela_codigos" class="table table-bordered table-striped mb-0">
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">Cargo</th>
                <th scope="col">Email Corporativo</th>
                <th scope="col">Data de Cadastro</th>
                <th scope="col">Código de ativação</th>
                <th scope="col">Ativo</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
  </main>

  <footer>

  </footer>
</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/cadastro-usuario.js"></script>
<script>
</script>
